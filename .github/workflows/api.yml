name: API CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api.yml'
    tags:
      - 'api-v*'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tridhata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/tridhata_test?schema=public

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm --filter api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/tridhata_test?schema=public
          JWT_ACCESS_SECRET: test-secret-minimal-32-karakter-keamanan
          CORS_ORIGIN: http://localhost:5173
          GOOGLE_SA_EMAIL: test@example.com
          GOOGLE_SA_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC\n-----END PRIVATE KEY-----\n"

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/api-v')
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy API to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/tridhata-ops
            git pull
            docker compose -f infra/compose.api.yml up -d --build api
            sleep 5
            curl -f http://localhost:3000/health || exit 1
