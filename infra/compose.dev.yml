services:
  db:
    image: postgres:16
    container_name: tridhata-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tridhata
    ports:
      - '5433:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tridhata']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
