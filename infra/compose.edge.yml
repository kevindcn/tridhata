services:
  edge:
    image: caddy:2
    container_name: tridhata-edge
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
volumes: { caddy_data: {}, caddy_config: {} }
networks: { edge: { external: true } }
